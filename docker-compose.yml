## Docker Compose for Qubic Explorer built from source.
## Copy .env.example → .env and adjust operator settings there.
##
##   docker compose up -d
##

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: qubic-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/clickhouse/disable-system-logs.xml:/etc/clickhouse-server/config.d/disable-system-logs.xml:ro
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    environment:
      - CLICKHOUSE_DB=qubic
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  indexer:
    build:
      context: ./src
      dockerfile: QubicExplorer.Indexer/Dockerfile
      args:
        # Public NuGet only by default. Set USE_LOCAL_PACKAGES=true in your
        # environment (or a .env file) to swap in ./src/local-packages/ as an
        # extra source — needed only when building against pre-release Qubic.*
        # packages that aren't published to nuget.org yet.
        USE_LOCAL_PACKAGES: ${USE_LOCAL_PACKAGES:-false}
    container_name: qubic-indexer
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - Bob__Nodes__0=${BOB_URL:-https://bobnet.qubic.li}
      - ClickHouse__Host=clickhouse
      - ClickHouse__Port=8123
      - ClickHouse__Database=qubic
      - ClickHouse__User=${CLICKHOUSE_USER:-default}
      - ClickHouse__Password=${CLICKHOUSE_PASSWORD:-}
      - Indexer__StartTick=${INDEXER_START_TICK:-0}
      - Indexer__StartFromLatest=${INDEXER_START_FROM_LATEST:-false}
      - Indexer__BatchSize=1000
      - Indexer__FlushIntervalMs=1000
      - Seq__ServerUrl=${SEQ_URL:-}
      - Seq__ApiKey=${SEQ_API_KEY:-}
    restart: unless-stopped

  analytics:
    build:
      context: ./src
      dockerfile: QubicExplorer.Analytics/Dockerfile
      args:
        USE_LOCAL_PACKAGES: ${USE_LOCAL_PACKAGES:-false}
    container_name: qubic-analytics
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - Bob__Nodes__0=${BOB_URL:-https://bobnet.qubic.li}
      - ClickHouse__Host=clickhouse
      - ClickHouse__Port=8123
      - ClickHouse__Database=qubic
      - ClickHouse__User=${CLICKHOUSE_USER:-default}
      - ClickHouse__Password=${CLICKHOUSE_PASSWORD:-}
      - AdminApiKey=${ADMIN_API_KEY:-}
      - Seq__ServerUrl=${SEQ_URL:-}
      - Seq__ApiKey=${SEQ_API_KEY:-}
    restart: unless-stopped

  api:
    build:
      context: ./src
      dockerfile: QubicExplorer.Api/Dockerfile
      args:
        USE_LOCAL_PACKAGES: ${USE_LOCAL_PACKAGES:-false}
    container_name: qubic-api
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Bob__Nodes__0=${BOB_URL:-https://bobnet.qubic.li}
      - ClickHouse__Host=clickhouse
      - ClickHouse__Port=8123
      - ClickHouse__Database=qubic
      - ClickHouse__User=${CLICKHOUSE_USER:-default}
      - ClickHouse__Password=${CLICKHOUSE_PASSWORD:-}
      - AdminApiKey=${ADMIN_API_KEY:-}
      - Seq__ServerUrl=${SEQ_URL:-}
      - Seq__ApiKey=${SEQ_API_KEY:-}
    restart: unless-stopped

  pruner:
    build:
      context: ./src
      dockerfile: QubicExplorer.Pruner/Dockerfile
    container_name: qubic-pruner
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - ClickHouse__Host=clickhouse
      - ClickHouse__Port=8123
      - ClickHouse__Database=qubic
      - ClickHouse__User=${CLICKHOUSE_USER:-default}
      - ClickHouse__Password=${CLICKHOUSE_PASSWORD:-}
      - Pruner__DryRun=${PRUNER_DRY_RUN:-true}
      - Pruner__IntervalMinutes=60
      - Seq__ServerUrl=${SEQ_URL:-}
      - Seq__ApiKey=${SEQ_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qubic-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side API URL (internal Docker network)
      - NUXT_API_URL=http://api:8080
      # Client-side API URL (empty = use same origin via nginx)
      - NUXT_PUBLIC_API_URL=
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: qubic-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  clickhouse_data:
